# Builds on every push and pull request. Pushing a tag like v1.2.0 also
# publishes a GitHub release with both executables attached.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        shell: pwsh
        run: |
          scripts/build.ps1
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF.Substring(11) } else { "0.0.0" }
          scripts/build.ps1 -Portable -Installer -Version $v

      - name: Name the files
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF.Substring(11) } else { 'dev' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item dist/portable/Snapline.exe "out/Snapline-$v-portable.exe"
          Copy-Item dist/win-x64/Snapline.exe "out/Snapline-$v.exe"
          Copy-Item (Get-ChildItem dist/Snapline-*-Setup.exe | Select-Object -First 1).FullName "out/Snapline-$v-Setup.exe"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: Snapline
          path: out/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          generate_release_notes: true
          body: |
            **Snapline-*-Setup.exe** installs Snapline with a Start Menu entry and an uninstaller. Recommended.
            **Snapline-*-portable.exe** runs on any Windows 10 or 11 PC without installing anything.
            **Snapline-*.exe** is the small build and needs the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0).

            The app is not code-signed yet, so SmartScreen may show "Windows protected your PC" the first time. Click *More info*, then *Run anyway*.

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the app
        working-directory: macos
        run: |
          swift --version
          VERSION=0.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          export VERSION
          bash scripts/make-dmg.sh
          mkdir -p ../out-mac
          cp build/Snapline-*.zip build/Snapline-*.dmg ../out-mac/

      - name: Render a snapshot of the line
        working-directory: macos
        run: |
          build/Snapline.app/Contents/MacOS/Snapline --snapshot ../out-mac/snapshot.png ../docs/samples/arabic-site.png ../docs/samples/yahoo.png ../docs/samples/arabic-dashboard.png

      - uses: actions/upload-artifact@v4
        with:
          name: Snapline-mac
          path: out-mac/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out-mac/*.zip
            out-mac/*.dmg
